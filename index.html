<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="核獸紀行">
<meta name="theme-color" content="#0e1621">
<title>核獸紀行</title>
<style>
  :root{
    --bg:#0e1621; --panel:#162235; --line:rgba(255,255,255,.12);
    --text:#e8eef6; --muted:#8aa0b8; --gold:#f0c14b; --hp:#3dd68c;
    --danger:#e85d5d;
  }
  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  html,body{position:fixed;inset:0;width:100%;height:100%;background:#070b10;color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
    overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
  #app{position:fixed;top:var(--app-top,0px);left:0;right:0;width:100%;max-width:430px;
    height:var(--app-h,100%);margin:0 auto;background:var(--bg);overflow:hidden;
    box-shadow:0 0 0 1px #111,0 12px 40px rgba(0,0,0,.45)}
  .view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .view.on{display:flex}
  button{font:inherit;color:inherit;border:1px solid var(--line);background:#203047;
    border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  @media (hover:hover){
    button:active{transform:translateY(1px);filter:brightness(1.08)}
  }
  button:disabled{opacity:.4}
  button.gold{background:var(--gold);color:#2a1d05;border-color:transparent}
  button.ghost{background:transparent}
  h1,h2{font-weight:900;letter-spacing:.04em}
  .muted{color:var(--muted)}
  .port{width:72px;height:72px;image-rendering:pixelated;image-rendering:crisp-edges;
    flex:0 0 auto;background:transparent}

  #title{justify-content:flex-start;align-items:center;text-align:center;gap:10px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
    background:radial-gradient(circle at 50% 20%,#243656,var(--bg) 70%)}
  #title .mark{width:88px;height:88px;flex:0 0 auto;image-rendering:pixelated}
  #title h1{flex:0 0 auto;font-size:28px}
  #title p{line-height:1.6;max-width:320px;font-size:13px;flex:0 0 auto}
  #title .btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;
    margin-top:auto;position:relative;z-index:5;padding-top:8px}
  #title .btns button{width:100%;min-height:48px;position:relative;z-index:5}

  #starter{padding:max(18px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));
    gap:10px;min-height:0}
  #starter .cards{display:flex;flex-direction:column;gap:10px;overflow:auto;
    touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .scard{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;
    border:1px solid var(--line);background:#132033;text-align:left}
  .scard b{font-size:18px}
  .scard small{display:block;margin-top:4px;color:var(--muted);line-height:1.5}

  #world canvas,#bcv{width:100%;height:100%;display:block;background:#0a1220;touch-action:none;
    image-rendering:pixelated;image-rendering:crisp-edges}
  #world .stage{flex:1;position:relative;min-height:0}
  #hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;
    display:flex;justify-content:space-between;pointer-events:none;z-index:3}
  #hud .chip{background:rgba(10,16,28,.72);border:1px solid var(--line);border-radius:10px;
    padding:6px 10px;font-size:13px;font-weight:800}
  #controls{flex:0 0 auto;height:auto;padding:8px 14px max(10px,env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;
    background:linear-gradient(#101a28,#0c141f);touch-action:none}
  #dpad{width:176px;height:176px;position:relative;justify-self:start;
    touch-action:none;-webkit-user-select:none;user-select:none}
  #dpad:before{content:"";position:absolute;inset:-20px;border-radius:50%}
  #dpad:after{content:"";position:absolute;left:52px;top:52px;width:72px;height:72px;
    border-radius:50%;background:#1a2838;border:2px solid var(--line);pointer-events:none}
  #dpad b{position:absolute;width:64px;height:64px;border-radius:16px;background:#2a3d58;
    display:grid;place-items:center;font-size:22px;border:2px solid var(--line);
    pointer-events:none;box-shadow:0 3px 0 #152030}
  #dpad b.on{background:#f0c14b;color:#2a1d05;border-color:#c9a43a;box-shadow:0 1px 0 #8a7020}
  #dU{left:56px;top:0} #dD{left:56px;bottom:0} #dL{left:0;top:56px} #dR{right:0;top:56px}
  #abtn{justify-self:end;display:flex;gap:14px;align-items:center}
  #btnA,#btnM{width:78px;height:78px;border-radius:50%;font-size:16px;box-shadow:0 4px 0 #152030}
  #btnA{background:#f0c14b;color:#2a1d05;border:none}
  #btnA:active{transform:translateY(2px);box-shadow:0 1px 0 #8a7020}
  #btnM{background:#2a3d58}
  #btnM:active{transform:translateY(2px);box-shadow:0 1px 0 #0e1620}
  @media (max-height: 740px), (pointer: coarse){
    #dpad{width:140px;height:140px}
    #dpad:after{left:40px;top:40px;width:60px;height:60px}
    #dpad b{width:50px;height:50px}
    #dU{left:45px} #dD{left:45px} #dL{top:45px} #dR{top:45px}
    #btnA,#btnM{width:62px;height:62px}
    #title .mark{width:72px;height:72px}
    #controls{padding:6px 12px max(8px,env(safe-area-inset-bottom))}
  }
  @media (max-height: 620px){
    #dpad{width:120px;height:120px}
    #dpad:after{left:34px;top:34px;width:52px;height:52px}
    #dpad b{width:44px;height:44px;font-size:18px}
    #dU{left:38px} #dD{left:38px} #dL{top:38px} #dR{top:38px}
    #btnA,#btnM{width:54px;height:54px;font-size:14px}
    #controls{gap:4px;padding:4px 10px max(6px,env(safe-area-inset-bottom))}
  }

  #battle{background:#0b1a12}
  #arena{flex:1;min-height:0;position:relative}
  .spdbtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;z-index:4;
    min-width:54px;padding:8px 12px;font-size:13px;border-radius:10px;
    background:rgba(10,16,28,.78);border:1px solid var(--line);font-weight:800}
  .chart-row{padding:8px 10px;border-radius:12px;background:#1a2740;margin-bottom:8px}
  .chart-row .atk{margin-bottom:6px}
  #bcv{width:100%;height:100%;display:block}
  .hpbox{position:absolute;min-width:158px;max-width:62%;
    background:#f4ead0;color:#2a2214;border:3px solid #2c2418;
    border-radius:8px 16px 8px 12px;padding:6px 10px 8px;
    box-shadow:3px 3px 0 rgba(0,0,0,.28);pointer-events:none}
  .hpbox.foe{top:max(10px,env(safe-area-inset-top));left:10px}
  .hpbox.me{bottom:8px;right:10px}
  .hpbox .nm{font-weight:900;font-size:14px}
  .hpbox.foe.is-rare{border-color:#c9a43a;box-shadow:0 0 0 2px rgba(240,193,75,.5),3px 3px 0 rgba(0,0,0,.28)}
  .tag-rare{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
    background:#f0c14b;color:#2a1d05;font-size:10px;font-weight:900;vertical-align:middle;
    letter-spacing:.04em}
  .hpbox .muted{color:#6d5b3c;font-size:11px;margin-top:3px;font-weight:700}
  .bar{height:8px;background:#cbb99a;border-radius:99px;overflow:hidden;margin-top:5px;border:1px solid #2c2418}
  .bar i{display:block;height:100%;width:50%;background:#3dd68c;transition:width .28s linear}
  .bar.hp i.mid{background:#e2b341} .bar.hp i.low{background:#e85d5d}
  .expline{display:flex;align-items:center;gap:6px;margin-top:6px}
  .expline span{font-size:10px;font-weight:900;color:#5a4a30;flex:0 0 auto}
  .bar.exp{height:6px;flex:1;margin-top:0;background:#4a3c2c}
  .bar.exp i{background:#4fc3f7}
  #blog{min-height:58px;margin:0 10px;padding:10px 12px;border-radius:8px;
    background:#f4ead0;color:#2a2214;border:3px solid #2c2418;font-size:15px;line-height:1.5;font-weight:800}
  #bcmd{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto;
    padding:10px 12px max(10px,env(safe-area-inset-bottom));background:#1a2740}

  #overlay{position:absolute;inset:0;background:rgba(6,10,16,.72);display:none;
    z-index:20;flex-direction:column;justify-content:flex-end;touch-action:auto;
    pointer-events:none}
  #overlay.on{display:flex;pointer-events:auto}
  #sheet{background:#121c2b;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:14px 14px 8px;max-height:82%;display:flex;flex-direction:column;min-height:0;
    touch-action:pan-y}
  #sheet h2{font-size:18px;margin-bottom:10px;flex:0 0 auto}
  .sheet-body{overflow:auto;flex:1;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .sheet-actions{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;
    padding:10px 0 max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:8px}
  .sheet-actions .wide{grid-column:1/-1}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:10px;border-radius:12px;background:#1a2740;margin-bottom:8px;min-height:48px}
  .row .l{display:flex;align-items:center;gap:8px;font-weight:800}
  .listbtn{width:100%;text-align:left;margin-bottom:8px}
  #sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .type{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:800;
    color:#111;margin-right:3px}
  textarea#savebox{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--line);
    background:#0e1621;color:var(--text);padding:8px;font-size:12px;
    -webkit-user-select:text;user-select:text;touch-action:auto}
  .toast{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);
    background:#f0c14b;color:#2a1d05;padding:8px 14px;border-radius:99px;
    font-weight:800;font-size:13px;display:none;z-index:30;white-space:nowrap;
    pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="view on">
    <canvas class="mark" id="titleArt" width="120" height="120"></canvas>
    <h1>核獸紀行</h1>
    <p class="muted">暉光地方：四座城鎮、四座道館。<br>收編核獸、走完一整塊地區。</p>
    <div class="btns">
      <button type="button" class="gold" id="btnNew" onclick="window.startNewGame&&window.startNewGame()">新的旅程</button>
      <button type="button" id="btnContinue" onclick="window.continueGame&&window.continueGame()">繼續冒險</button>
      <button type="button" class="ghost" id="btnRestore" hidden onclick="window.restoreBakGame&&window.restoreBakGame()">恢復上一份存檔</button>
      <button type="button" class="ghost" id="btnHelp" onclick="window.openHelp&&window.openHelp()">手機遊玩與存檔</button>
    </div>
  </section>

  <section id="starter" class="view">
    <h2>選擇最初的核獸</h2>
    <p class="muted">三種淵源皆可收編，先選一隻同行。</p>
    <div class="cards" id="starterCards"></div>
    <button class="ghost" id="starterBack">返回標題</button>
  </section>

  <section id="world" class="view">
    <div class="stage">
      <canvas id="cv"></canvas>
      <div id="hud">
        <div class="chip" id="place">暉光鎮</div>
        <div class="chip" id="money">◎ 0</div>
      </div>
    </div>
    <div id="controls">
      <div id="dpad">
        <b id="dU">▲</b><b id="dD">▼</b><b id="dL">◀</b><b id="dR">▶</b>
      </div>
      <div id="abtn">
        <button id="btnM">選單</button>
        <button id="btnA">確認</button>
      </div>
    </div>
  </section>

  <section id="battle" class="view">
    <div id="arena">
      <canvas id="bcv"></canvas>
      <button type="button" class="spdbtn" id="spdBtn">1×</button>
      <div class="hpbox foe" id="fBox">
        <div class="nm" id="fName">——</div>
        <div class="bar hp"><i id="fHp"></i></div>
        <div class="muted" id="fMeta"></div>
      </div>
      <div class="hpbox me" id="pBox">
        <div class="nm" id="pName">——</div>
        <div class="bar hp"><i id="pHp"></i></div>
        <div class="muted" id="pMeta"></div>
        <div class="expline"><span id="pExpLab">EXP</span><div class="bar exp"><i id="pExp"></i></div></div>
      </div>
    </div>
    <div id="blog">遭遇了野生核獸！</div>
    <div id="bcmd"></div>
  </section>

  <div id="overlay"><div id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
"use strict";
window.addEventListener("error", function(ev){
  const box = document.getElementById("title");
  if(!box || box.querySelector(".boot-err")) return;
  const p = document.createElement("p");
  p.className = "boot-err";
  p.style.cssText = "color:#e85d5d;max-width:320px;font-size:13px;line-height:1.5";
  p.textContent = "腳本錯誤：" + (ev.message||"unknown") + (ev.lineno ? "（第 "+ev.lineno+" 行）" : "");
  box.appendChild(p);
});

function fitAppFrame(){
  const vv = window.visualViewport;
  const h = Math.max(320, Math.round(vv && vv.height ? vv.height : window.innerHeight));
  const top = Math.max(0, Math.round(vv && vv.offsetTop ? vv.offsetTop : 0));
  document.documentElement.style.setProperty("--app-h", h+"px");
  document.documentElement.style.setProperty("--app-top", top+"px");
}
fitAppFrame();
if(window.visualViewport){
  visualViewport.addEventListener("resize", fitAppFrame);
  visualViewport.addEventListener("scroll", fitAppFrame);
}
window.addEventListener("orientationchange", ()=> setTimeout(fitAppFrame, 120));

const SAVE_KEY = "nuclea_save_v1";
const SAVE_BAK = "nuclea_save_v1_bak";
const CFG_KEY = "nuclea_cfg_v1";
const CFG = { spd:1 };
try{ Object.assign(CFG, JSON.parse(localStorage.getItem(CFG_KEY)||"{}")); }catch(e){}
if(![1,2,3].includes(+CFG.spd)) CFG.spd = 1;
else CFG.spd = +CFG.spd;
function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); }catch(e){} }
function spdLabel(){ return CFG.spd+"×"; }
function cycleSpeed(){
  CFG.spd = CFG.spd===1?2:CFG.spd===2?3:1;
  saveCfg();
  if($("spdBtn")) $("spdBtn").textContent = spdLabel();
  toast("戰鬥速度 "+spdLabel());
}
const $ = id => document.getElementById(id);
const views = { title:$("title"), starter:$("starter"), world:$("world"), battle:$("battle") };
const canvas = $("cv"), ctx = canvas.getContext("2d");
const bcanvas = $("bcv"), bctx = bcanvas.getContext("2d");
const overlay = $("overlay"), sheet = $("sheet"), toastEl = $("toast");

function showView(name){
  Object.keys(views).forEach(k => views[k].classList.toggle("on", k===name));
}
function toast(t){
  toastEl.textContent = t; toastEl.style.display = "block";
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>{ toastEl.style.display = "none"; }, 1400);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function wait(ms){ return new Promise(r=>setTimeout(r, ms/CFG.spd)); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function tween(ms, fn){
  return new Promise(resolve=>{
    const t0 = performance.now();
    const dur = Math.max(40, ms/CFG.spd);
    (function step(t){
      const p = Math.min(1,(t-t0)/dur);
      fn(p);
      if(p<1) requestAnimationFrame(step); else resolve();
    })(t0);
  });
}

const TYPE_COLOR = {
  火:"#ff8a4c", 水:"#4fc3f7", 草:"#66bb6a", 電:"#ffd54f",
  岩:"#bcaaa4", 鋼:"#90a4ae", 暗:"#9575cd", 冰:"#b3e5fc",
  靈:"#e1bee7", 普:"#cfd8dc", 蟲:"#c5e1a5", 龍:"#7e57c2"
};
const CHART = {
  火:{草:2,鋼:2,冰:2,蟲:2,水:.5,岩:.5,火:.5,龍:.5},
  水:{火:2,岩:2,水:.5,草:.5,龍:.5},
  草:{水:2,岩:2,火:.5,草:.5,鋼:.5,冰:.5,蟲:.5,龍:.5},
  電:{水:2,岩:.5,電:.5,草:.5,鋼:.5,龍:.5},
  岩:{火:2,電:2,冰:2,蟲:2,鋼:.5,草:.5},
  鋼:{岩:2,冰:2,火:.5,鋼:.5,水:.5,靈:.5,蟲:.5},
  暗:{鋼:2,靈:2,草:1.5,暗:.5,火:.5,蟲:.5},
  冰:{草:2,岩:2,龍:2,火:.5,鋼:.5,水:.5,冰:.5},
  靈:{暗:2,靈:2,普:.5,鋼:.5},
  普:{靈:.5},
  蟲:{草:2,暗:2,靈:2,火:.5,鋼:.5,岩:.5},
  龍:{龍:2,鋼:.5}
};
function typeMul(atk, defs){
  let m = 1;
  defs.forEach(d => { m *= (CHART[atk] && CHART[atk][d] != null) ? CHART[atk][d] : 1; });
  return m;
}
function typeBadge(t){ return `<span class="type" style="background:${TYPE_COLOR[t]||"#ccc"}">${t}</span>`; }

const SPRITES = {
  emberkit:{ pal:{a:"#ff8a3d",b:"#d94a10",c:"#ffd36a",d:"#fff1d2",e:"#1a1008",f:"#ff4d1a",o:"#3a1408"},

  droplet:{ pal:{a:"#4fc3f7",b:"#0277bd",c:"#b3e5fc",d:"#e3f7ff",e:"#102030",f:"#01579b",o:"#0a2030"},
    f:["................","......aaa.......",".....aaaaa......","....aacccaa.....","...aacdddcaa....","...abeddebaa....","...aacdddcaa....","....aaaaaaaa....","....aaaaaaaa....",".....aa..aa.....","....aaa..aaa....","....aa....aa....","................","................","................","................"]},
  abyssfin:{ pal:{a:"#1565c0",b:"#0d47a1",c:"#e3f2fd",d:"#90caf9",e:"#0a1630",f:"#bbdefb",o:"#061018"},
    f:["................",".........bb.....","........bbb.....","...aaaaaabaaa...","..aaaaaaaaaaaaa.","aaaaaaaaaaaaaaa.","aaccecaaaaaaaaaa","aaaaaaaaaaaaaaa.","..aaaaaaaaaaaa..","...aa......aa...","....a......a....","................","................","................","................","................"]},

    f:["................","....b.b.b.......","...bccccccb.....","..bcaaaaaacb....","..caeddeeac.....","..caaaaaaaac....","..bcaaaaaacb....","...bccccccb.....","....aaaaaa......","....aa..aa......","...aaa..aaa.....","...aa....aa.....","................","................","................","................"]},

function shadeHex(hex, amt){
  if(!hex || hex[0]!=="#") return hex || "#fff";
  let h = hex.slice(1);
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  let r=(n>>16)&255, gv=(n>>8)&255, b=n&255;
  r = clamp(r+amt,0,255); gv = clamp(gv+amt,0,255); b = clamp(b+amt,0,255);
  return "#"+((1<<24)+(r<<16)+(gv<<8)+b).toString(16).slice(1);
}
const _up3 = new Map();
function up3(grid){
  const key = grid.join("\n");
  if(_up3.has(key)) return _up3.get(key);
  const h = grid.length, w = grid[0].length;
  const at = (x,y)=>{
    const xx = x<0?0:x>w-1?w-1:x, yy = y<0?0:y>h-1?h-1:y;
    return grid[yy][xx];
  };
  const out = new Array(h*3);
  for(let y=0;y<h;y++){
    let r0="", r1="", r2="";
    for(let x=0;x<w;x++){
      const A=at(x-1,y-1), B=at(x,y-1), C=at(x+1,y-1);
      const D=at(x-1,y),   E=at(x,y),   F=at(x+1,y);
      const G=at(x-1,y+1), H=at(x,y+1), I=at(x+1,y+1);
      let e0=E,e1=E,e2=E,e3=E,e4=E,e5=E,e6=E,e7=E,e8=E;
      if(B!==H && D!==F){
        e0 = D===B ? D : E;
        e1 = (D===B && E!==C) || (B===F && E!==A) ? B : E;
        e2 = B===F ? F : E;
        e3 = (D===B && E!==G) || (D===H && E!==A) ? D : E;
        e5 = (B===F && E!==I) || (H===F && E!==C) ? F : E;
        e6 = D===H ? D : E;
        e7 = (D===H && E!==I) || (H===F && E!==G) ? H : E;
        e8 = H===F ? F : E;
      }
      r0+=e0+e1+e2; r1+=e3+e4+e5; r2+=e6+e7+e8;
    }
    out[y*3]=r0; out[y*3+1]=r1; out[y*3+2]=r2;
  }
  _up3.set(key, out);
  return out;
}
function hexRgb(hex){
  if(!hex || hex[0]!=="#") return [255,255,255];
  let h = hex.slice(1);
  if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
const _pixCache = new Map();
function rasterSprite(grid, pal, opt){
  const hq = opt.hq!==false && grid[0].length<=24;
  const flip = !!opt.flip, sil = !!opt.sil, flash = opt.flash>0.45;
  const key = grid.join("\n")+JSON.stringify(pal)+(flip?"f":"")+(sil?"s":"")+(flash?"w":"")+(hq?"3":"");
  if(_pixCache.has(key)) return _pixCache.get(key);
  if(hq) grid = up3(grid);
  const w = grid[0].length, h = grid.length, pad = 1;
  const cw = w+pad*2, ch = h+pad*2;
  const c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  const g = c.getContext("2d");
  const img = g.createImageData(cw, ch);
  const data = img.data;
  const pix = (x,y)=>{
    if(y<0||x<0||y>=h||x>=w) return ".";
    const chv = grid[y][flip ? w-1-x : x];
    return (!chv || chv===".") ? "." : chv;
  };
  const put = (x,y,rgb,a)=>{
    if(x<0||y<0||x>=cw||y>=ch) return;
    const i = (y*cw+x)*4;
    if(a<255 && data[i+3]>=a) return;
    data[i]=rgb[0]; data[i+1]=rgb[1]; data[i+2]=rgb[2]; data[i+3]=a;
  };
  const outline = hexRgb(pal.o || "#140e0a");
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const chv = pix(x,y);
      if(chv===".") continue;
      let col = sil ? [26,31,40] : (flash ? [255,255,255] : hexRgb(pal[chv]||"#fff"));
      if(!sil && !flash && (pix(x-1,y)==="."||pix(x+1,y)==="."||pix(x,y-1)==="."||pix(x,y+1)===".")){
        col = [Math.max(0,col[0]-20), Math.max(0,col[1]-20), Math.max(0,col[2]-20)];
      }
      put(x+pad, y+pad, col, 255);
    }
  }
  if(!sil && !flash){
    for(let y=-1;y<=h;y++){
      for(let x=-1;x<=w;x++){
        if(pix(x,y)!==".") continue;
        const o = (pix(x-1,y)!==".")+(pix(x+1,y)!==".")+(pix(x,y-1)!==".")+(pix(x,y+1)!==".");
        const d = (pix(x-1,y-1)!==".")+(pix(x+1,y-1)!==".")+(pix(x-1,y+1)!==".")+(pix(x+1,y+1)!==".");
        if(o>=1) put(x+pad, y+pad, outline, 255);
        else if(d>=2) put(x+pad, y+pad, outline, 96);
      }
    }
  }
  g.putImageData(img, 0, 0);
  const rec = { c, w, h, pad };
  _pixCache.set(key, rec);
  return rec;
}
function drawPixels(g, grid, pal, cx, cy, size, opt){
  opt = opt || {};
  if(!grid || !grid.length) return;
  const rec = rasterSprite(grid, pal, opt);
  const drawW = size;
  const drawH = size * (rec.h / rec.w);
  const extraX = drawW / rec.w;
  const extraY = drawH / rec.h;
  g.save();
  g.translate(cx + (opt.x||0), cy + (opt.y||0) + (opt.bob||0) + (opt.sink||0));
  g.globalAlpha = opt.alpha == null ? 1 : opt.alpha;
  if(opt.scale) g.scale(opt.scale, opt.scale);
  g.translate(-drawW/2, opt.feet ? -drawH : -drawH*0.86);
  g.imageSmoothingEnabled = false;
  g.drawImage(rec.c, -extraX, -extraY, drawW+extraX*2, drawH+extraY*2);
  g.restore();
}
function drawSprite(g, sid, cx, cy, size, opt){
  const sp = SPRITES[sid];
  if(!sp) return;
  drawPixels(g, sp.f, sp.pal, cx, cy, size, opt);
}

const sprCache = {};
function sprURL(sid, sil){
  const key = sid+(sil?"_s":"");
  if(sprCache[key]) return sprCache[key];
  const c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  drawSprite(g, sid, 64, 94, 116, {sil:!!sil});
  sprCache[key] = c.toDataURL();
  return sprCache[key];
}
function port(sid, known){
  if(!known) return `<img class="port" alt="" src="${sprURL(sid,true)}">`;
  return `<img class="port" alt="" src="${sprURL(sid)}">`;
}

function maxHp(mon){
  const b = SPECIES[mon.sid].base.hp;
  return Math.floor(b*2*mon.lv/100)+mon.lv+10;
}
function statOf(mon, key){
  const b = SPECIES[mon.sid].base[key];
  return Math.floor(b*2*mon.lv/100)+5;
}
function expToNext(lv){ return lv*lv*lv; }
function movesFor(sid, lv){
  return SPECIES[sid].learn.filter(x=>x[0]<=lv).map(x=>x[1]).slice(-4);
}
function createMon(sid, lv){
  const mon = { uid:uid(), sid, lv, exp:0, moves:movesFor(sid,lv) };
  mon.hp = maxHp(mon);
  return mon;
}
function cloneMon(m){ return JSON.parse(JSON.stringify(m)); }
function monName(m){ return SPECIES[m.sid].name; }
function isRareSpecies(sid){
  const sp = SPECIES[sid];
  return !!(sp && sp.rate<=40);
}
function isRareSpawn(sid, weight){
  return isRareSpecies(sid) || (weight!=null && weight<=0.4);
}
function rareBadge(){ return `<span class="tag-rare">稀有</span>`; }
function isFaint(m){ return m.hp<=0; }
function living(list){ return list.filter(m=>!isFaint(m)); }

const stampCache = {};
function drawStamp(g, dx, dy, tw, th, rows, palmap){
  const key = rows.join("")+Object.values(palmap).join("");
  let c = stampCache[key];
  if(!c){
    const n = rows[0].length, h = rows.length, s = 3;
    c = document.createElement("canvas");
    c.width = n*s; c.height = h*s;
    const cg = c.getContext("2d");
    for(let y=0;y<h;y++){
      for(let x=0;x<n;x++){
        const col = palmap[rows[y][x]];
        if(!col) continue;
        cg.fillStyle = col;
        cg.fillRect(x*s, y*s, s, s);
      }
    }
    stampCache[key] = c;
  }
  g.imageSmoothingEnabled = false;
  g.drawImage(c, dx, dy, tw, th);
}

    d: pal.floor, D: shadeHex(pal.floor, 16),

    L: pal.g2, l: shadeHex(pal.g2, 28), t: "#5d4037"
  };
}
function drawGrassTufts(g, dx, dy, ts, pal, phase, front){
  for(let i=0;i<6;i++){
    const gx = dx+4+(i*7)%(ts-10);
    const h = (front ? ts*0.42 : ts*0.28) + (i%3)*2;
    const gy = dy + ts - h + (front ? 1 : ts*0.08);
    g.fillStyle = i%2 ? pal.g2 : shadeHex(pal.g2, 18);
    g.fillRect(Math.floor(gx+Math.sin(phase+i)), Math.floor(gy), 3, Math.ceil(h));
  }
}
function drawGroundTile(g, t, dx, dy, ts, pal, x, y, south){
  const hash = ((x*19)^(y*37))&7;
  const tp = tilePal(pal, t);
  if(t==="#"){
    const edge = south && south!=="#" && south!=="屋" && south!=="~";
    drawStamp(g, dx, dy, ts, ts, edge ? PAT.cliff : PAT.wall, tp);
    return;
  }
  if(t==="~"){
    drawStamp(g, dx, dy, ts, ts, (Math.floor(worldT/380)+x+y)%2 ? PAT.water1 : PAT.water0, tp);
    return;
  }
  if(t==="g"){
    drawStamp(g, dx, dy, ts, ts, hash===3 ? PAT.grassF : PAT.grass, tp);
    return;
  }
  if(t==="H"){ drawStamp(g, dx, dy, ts, ts, PAT.heal, tp); return; }
  if(t==="S"){ drawStamp(g, dx, dy, ts, ts, PAT.shop, tp); return; }
  if(t==="屋"){ drawStamp(g, dx, dy, ts, ts, PAT.house, tp); return; }
  const path = t==="," || /[A-Z]/.test(t);
  drawStamp(g, dx, dy, ts, ts, path ? PAT.path : PAT.floor, tp);
}
function drawWorld(){
  if(!S) return;
  const map = MAPS[S.map];
  const rows = map.tiles, tw = rows[0].length, th = rows.length;
  const pal = mapPalette(S.map);
  const ts = TILE;
  const pos = playerXY();
  let bump = 0;
  if(walk.bump>0) bump = Math.sin((1-walk.bump/90)*Math.PI)*3;
  const px = pos.x*ts + ts/2 + dir.x*bump;
  const py = pos.y*ts + ts/2 + dir.y*bump;
  let camX = px - cw/2;
  let camY = py - ch/2;
  if(tw*ts <= cw) camX = -(cw - tw*ts)/2;
  else camX = clamp(camX, 0, tw*ts - cw);
  if(th*ts <= ch) camY = -(ch - th*ts)/2;
  else camY = clamp(camY, 0, th*ts - ch);
  ctx.clearRect(0,0,cw,ch);
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0,0,cw,ch);
  const x0 = Math.max(0, Math.floor(camX/ts)-1);
  const y0 = Math.max(0, Math.floor(camY/ts)-2);
  const x1 = Math.min(tw, Math.ceil((camX+cw)/ts)+1);
  const y1 = Math.min(th, Math.ceil((camY+ch)/ts)+2);
  const outdoor = !/^gym/.test(S.map) && S.map!=="cave" && S.map!=="factory";
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      const t = rows[y][x];
      const dx = Math.floor(x*ts - camX), dy = Math.floor(y*ts - camY);
      const south = y+1<th ? rows[y+1][x] : "#";
      drawGroundTile(ctx, t, dx, dy, ts, pal, x, y, south);
    }
  }
  if(outdoor){
    const tp = tilePal(pal, "#");
    for(let y=y0;y<y1;y++){
      for(let x=x0;x<x1;x++){
        if(rows[y][x]!=="#") continue;
        const south = y+1<th ? rows[y+1][x] : "#";
        if(south!=="#" && south!=="屋" && south!=="~"){
          const dx = Math.floor(x*ts - camX), dy = Math.floor(y*ts - camY);
          drawStamp(ctx, dx, dy-ts*0.35, ts, ts*1.15, PAT.tree, tp);
        }
      }
    }
  }
  const actors = [];
  (map.npcs||[]).forEach(n=>{
    actors.push({ kind:"npc", n, x:n.x, y:n.y });
  });
  actors.push({ kind:"hero", x:pos.x, y:pos.y });
  actors.sort((a,b)=>a.y-b.y);
  actors.forEach(a=>{
    if(a.kind==="hero"){
      const hx = a.x*ts - camX + ts/2 + dir.x*bump;
      const hy = a.y*ts - camY + ts*0.82 + dir.y*bump;
      drawShadow(ctx, hx, hy+2, ts);
      const hf = heroFrame();
      const bob = walk.active ? Math.sin(walk.t/walk.dur*Math.PI)*1.8 : 0;
      drawPixels(ctx, hf.grid, HERO_PAL, hx, hy, ts*1.05, {feet:true, flip:hf.flip, bob:-bob});
      const tile = tileAt(S.map, Math.round(a.x), Math.round(a.y));
      if(tile==="g"){
        const dx = Math.floor(Math.round(a.x)*ts - camX);
        const dy = Math.floor(Math.round(a.y)*ts - camY);
        drawGrassTufts(ctx, dx, dy, ts, pal, worldT/90, true);
      }
    }else{
      const n = a.n;
      const nx = n.x*ts - camX + ts/2;
      const ny = n.y*ts - camY + ts*0.82;
      drawShadow(ctx, nx, ny+2, ts);
      let face = "d";
      const dx = Math.round(pos.x)-n.x, dy = Math.round(pos.y)-n.y;
      if(Math.abs(dx)+Math.abs(dy)===1){
        face = Math.abs(dx)>Math.abs(dy) ? "s" : (dy<0?"u":"d");
      }
      drawPixels(ctx, NPC_BODY[face], npcPal(n.color), nx, ny, ts, {
        feet:true, flip: face==="s" && dx>0
      });
    }
  });
  const badges = ["gym1","gym2","gym3","gym4"].filter(k=>S.flags[k]).length;
  $("place").textContent = map.name + (badges?" · 徽章"+badges:"");
  $("money").textContent = "◎ "+S.money;
}

function npcAt(x,y){ return (MAPS[S.map].npcs||[]).find(n=>n.x===x&&n.y===y); }

function tryMove(dx,dy){
  if(busy || !S || !views.world.classList.contains("on")) return;
  if(walk.active) return;
  const same = dir.x===dx && dir.y===dy;
  dir = {x:dx,y:dy};
  if(!same){
    walk.turnLock = 70;
    return;
  }
  const nx = S.x+dx, ny = S.y+dy;
  const t = tileAt(S.map,nx,ny);
  if(npcAt(nx,ny) || !walkable(t)){
    walk.bump = 90;
    return;
  }
  walk.active = true;
  walk.sx = S.x; walk.sy = S.y;
  walk.dx = dx; walk.dy = dy;
  walk.t = 0;
  walk.step++;
}
function finishStep(){
  S.x = walk.sx + walk.dx;
  S.y = walk.sy + walk.dy;
  walk.active = false;
  walk.t = 0;
  const t = tileAt(S.map, S.x, S.y);
  const warp = MAPS[S.map].warps[t];
  if(warp){
    S.map = warp.map; S.x = warp.x; S.y = warp.y;
    persist();
    return;
  }
  persist();
  if(t==="g" && Math.random()<0.16){ startWild(); return; }
  if(moveHold) tryMove(moveHold.dx, moveHold.dy);
}
function updateWalk(dt){
  worldT += dt;
  if(walk.bump>0) walk.bump = Math.max(0, walk.bump-dt);
  if(busy || overlay.classList.contains("on")) return;
  if(walk.turnLock>0){
    walk.turnLock -= dt;
    if(walk.turnLock<=0 && moveHold) tryMove(moveHold.dx, moveHold.dy);
    return;
  }
  if(!walk.active){
    if(moveHold) tryMove(moveHold.dx, moveHold.dy);
    return;
  }
  walk.t += dt;
  if(walk.t >= walk.dur) finishStep();
}

function facingTile(){ return { x:S.x+dir.x, y:S.y+dir.y, ch:tileAt(S.map,S.x+dir.x,S.y+dir.y) }; }

function interact(){
  if(busy || walk.active) return;
  const t = tileAt(S.map,S.x,S.y);
  if(t==="H"){ healAll(); persist(); openDialog("治療臺",["核獸的傷勢已完全恢復。"]); return; }
  if(t==="S"){ openShop(); return; }
  const f = facingTile();
  const npc = npcAt(f.x,f.y);
  if(npc){
    if(npc.trainer){
      const key = S.map+":"+npc.name;
      if(S.flags.beaten[key]){ openDialog(npc.name,["你已經贏過我了。去挑戰更強的對手吧。"]); return; }
      const gflag = npc.trainer.gym === true ? "gym1" : npc.trainer.gym;
      if(gflag && S.flags[gflag]){ openDialog(npc.name,["這枚徽章已在你手上。繼續走訪暉光地方吧。"]); return; }
      openDialog(npc.name, npc.lines || [npc.name+"想要對戰！"], ()=> startTrainer(npc));
      return;
    }
    openDialog(npc.name, npc.lines);
  }
}

  if(!sp.evo) return "最終型";
  const to = SPECIES[sp.evo[0]].name;
  const need = sp.evo[1] - m.lv;
  if(need<=0) return "再升級就會進化成 "+to;
  return `再 ${need} 級 → ${to}`;
}

function useItem(key, mode){
  if((S.bag[key]||0)<=0) return;
  if(key==="ball"||key==="great"){
    if(mode!=="battle" || !battle || battle.kind!=="wild"){ toast("只能在野外捕捉"); return; }
    closeOverlay(); busy=true;
    S.bag[key]--; persist();
    resolveCatch(key);
    return;
  }
  openParty(mode==="battle"?"battle":"field", idx=>{
    const m = S.party[idx];
    if(isFaint(m)){ toast("瀕死無法回復"); return; }
    const heal = key==="super"?120:50;
    const room = maxHp(m)-m.hp;
    if(room<=0){ toast("HP 已滿"); return; }
    m.hp = Math.min(maxHp(m), m.hp+heal);
    S.bag[key]--; persist();
    toast(monName(m)+"回復了");
    if(mode==="battle"){ closeOverlay(); busy=true; afterPlayerItem(); }
    else openBag(mode);
  });
}

function setHpBar(el, mon){
  const pct = clamp(mon.hp/maxHp(mon)*100,0,100);
  el.style.width = pct+"%";
  el.className = pct<=25?"low":pct<=50?"mid":"";
}
function expPct(mon){
  if(!mon || mon.lv>=50) return 100;
  return clamp(mon.exp/expToNext(mon.lv)*100,0,100);
}
function setExpBar(mon, instant){
  const el = $("pExp"), lab = $("pExpLab");
  if(!el || !mon) return;
  const pct = expPct(mon);
  el.style.transition = instant ? "none" : "width .32s linear";
  el.style.width = pct+"%";
  if(lab) lab.textContent = mon.lv>=50 ? "MAX" : "EXP";
}
function paintHud(){
  if(!battle || !S) return;
  const you = S.party[battle.pi];
  const foe = battle.foe;
  if(!you || !foe) return;
  const ys = SPECIES[you.sid], fs = SPECIES[foe.sid];
  $("pName").textContent = ys.name+"　　Lv"+you.lv;
  $("fName").innerHTML = fs.name+(battle.kind==="wild"&&battle.rare?rareBadge():"")+"　　Lv"+foe.lv;
  $("pMeta").innerHTML = ys.types.map(typeBadge).join("")+" HP "+Math.max(0,you.hp)+"/"+maxHp(you);
  $("fMeta").innerHTML = (battle.kind==="wild"?"野生　":battle.trainerName+"　")+fs.types.map(typeBadge).join("");
  $("fBox").classList.toggle("is-rare", !!(battle.kind==="wild" && battle.rare));

function trail(a,b,n,shape,cols,extra){

      x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t,
      vx:(b.x-a.x)/22+(extra.j||0)*(Math.random()-0.5),

function updateFx(dt){
  for(let i=FX.length-1;i>=0;i--){
    const p = FX[i];
    p.life -= dt/p.max;
    p.x += p.vx*dt/16; p.y += p.vy*dt/16;
    p.vy += (p.g||0)*dt/16;
    p.rot = (p.rot||0)+dt*0.01;
    if(p.life<=0) FX.splice(i,1);
  }
  if(bat.bolt){ bat.bolt.life -= dt/220; if(bat.bolt.life<=0) bat.bolt=null; }
}
function drawFx(g){
  FX.forEach(p=>{
    g.globalAlpha = Math.max(0,p.life);
    g.fillStyle = p.c; g.strokeStyle = p.c;
    const r = p.r||3;
    if(p.shape==="ring"){
      g.beginPath(); g.lineWidth=3; g.arc(p.x,p.y, 10+(1-p.life)*22, 0, Math.PI*2); g.stroke();
    }else if(p.shape==="leaf"){
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot||0);
      g.beginPath(); g.ellipse(0,0,3,7,0,0,Math.PI*2); g.fill(); g.restore();
    }else if(p.shape==="star"){
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot||0);
      g.beginPath();
      for(let i=0;i<5;i++){
        const ang=-Math.PI/2+i*Math.PI*2/5;
        const rr = i%2 ? r*0.4 : r;
        g.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
      }
      g.closePath(); g.fill(); g.restore();
    }else if(p.shape==="slash"){
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot||0);
      g.lineWidth = Math.max(2,r); g.beginPath(); g.moveTo(-16,0); g.lineTo(16,0); g.stroke();
      g.restore();
    }else if(p.shape==="snow"){
      g.lineWidth=1.6;
      g.beginPath();
      g.moveTo(p.x-r,p.y); g.lineTo(p.x+r,p.y);
      g.moveTo(p.x,p.y-r); g.lineTo(p.x,p.y+r);
      g.moveTo(p.x-r*0.7,p.y-r*0.7); g.lineTo(p.x+r*0.7,p.y+r*0.7);
      g.stroke();
    }else if(p.shape==="flame"){
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot||0);
      g.beginPath(); g.ellipse(0,0,r*0.55,r*1.35,0,0,Math.PI*2); g.fill();
      g.restore();
    }else if(p.shape==="shard"){
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot||0);
      g.beginPath(); g.moveTo(0,-r); g.lineTo(r*0.55,r); g.lineTo(-r*0.55,r); g.fill();
      g.restore();
    }else if(p.shape==="gear"){
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot||0);
      g.lineWidth=2; g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.stroke();
      for(let i=0;i<6;i++){ g.rotate(Math.PI/3); g.fillRect(r-1,-2,4,4); }
      g.restore();
    }else{
      g.beginPath(); g.arc(p.x,p.y,r,0,Math.PI*2); g.fill();
    }
  });
  g.globalAlpha = 1;
  if(bat.bolt && bat.bolt.life>0){
    const a=bat.bolt.a, b=bat.bolt.b;
    g.strokeStyle = `rgba(255,230,80,${bat.bolt.life})`;
    g.lineWidth = 2.5; g.beginPath(); g.moveTo(a.x,a.y);
    const segs=6;
    for(let i=1;i<=segs;i++){
      const t=i/segs;
      g.lineTo(a.x+(b.x-a.x)*t+(Math.random()-0.5)*16, a.y+(b.y-a.y)*t+(Math.random()-0.5)*10);
    }
    g.stroke();
  }
}

function drawBattleBg(g){
  const theme = S ? S.map : "route1";
  let top="#7ec8ff", mid="#b8e0a0", bot="#6aaa3a", plat="#c6e06a", hill="#4a8a3e", cloud="#fff";
  if(theme==="quarry"){ top="#90a4ae"; mid="#bcaaa4"; bot="#6d4c41"; plat="#a1887f"; hill="#5d4037"; cloud="#eceff1"; }
  else if(theme==="gym"){ top="#ef6c00"; mid="#ffcc80"; bot="#bf360c"; plat="#ff8a50"; hill="#e65100"; cloud="#ffe0b2"; }
  else if(theme==="town"){ top="#90caf9"; mid="#ffe0b2"; bot="#8d6e63"; plat="#c4a574"; hill="#6d4c41"; cloud="#fff"; }
  else if(theme==="frost"||theme==="gym4"){ top="#b3e5fc"; mid="#e1bee7"; bot="#78909c"; plat="#eceff1"; hill="#90a4ae"; cloud="#fff"; }
  else if(theme==="coast"||theme==="port"||theme==="cave"||theme==="gym2"){ top="#4fc3f7"; mid="#80deea"; bot="#0277bd"; plat="#4dd0e1"; hill="#01579b"; cloud="#e0f7fa"; }
  else if(theme==="factory"||theme==="steel"||theme==="gym3"){ top="#546e7a"; mid="#90a4ae"; bot="#263238"; plat="#78909c"; hill="#37474f"; cloud="#cfd8dc"; }
  else if(theme==="forest"||theme==="shrine"){ top="#43a047"; mid="#66bb6a"; bot="#1b5e20"; plat="#81c784"; hill="#0d1f0c"; cloud="#c8e6c9"; }
  else if(theme==="star"||theme==="peak"){ top="#4527a0"; mid="#7e57c2"; bot="#1a1040"; plat="#9575cd"; hill="#311b92"; cloud="#ede7f6"; }
  const grd = g.createLinearGradient(0,0,0,bh);
  grd.addColorStop(0,top); grd.addColorStop(0.55,mid); grd.addColorStop(1,bot);
  g.fillStyle=grd; g.fillRect(0,0,bw,bh);
  g.fillStyle = "rgba(255,255,255,.22)";
  [[0.18,0.12,0.16],[0.62,0.08,0.12],[0.84,0.16,0.1]].forEach(([x,y,r])=>{
    g.beginPath(); g.ellipse(bw*x, bh*y, bw*r, bh*r*0.38, 0,0,Math.PI*2); g.fill();
  });
  g.fillStyle = hill;
  g.beginPath(); g.moveTo(0,bh*0.42); g.quadraticCurveTo(bw*0.25,bh*0.28,bw*0.5,bh*0.40); g.quadraticCurveTo(bw*0.75,bh*0.52,bw,bh*0.36); g.lineTo(bw,bh); g.lineTo(0,bh); g.fill();
  g.fillStyle = bot;
  g.fillRect(0, bh*0.58, bw, bh*0.42);
  g.fillStyle = "rgba(0,0,0,.08)";
  for(let i=0;i<18;i++) g.fillRect((i*37)%bw, bh*0.62+((i*13)%20), 8, 3);
  function ring(x,y,rx,ry,c1,c2){
    g.fillStyle="rgba(0,0,0,.22)";
    g.beginPath(); g.ellipse(x,y+4, rx*1.05, ry*0.95, 0,0,Math.PI*2); g.fill();
    g.fillStyle=c1;
    g.beginPath(); g.ellipse(x,y, rx, ry, 0,0,Math.PI*2); g.fill();
    g.fillStyle=c2;
    g.beginPath(); g.ellipse(x,y-2, rx*0.78, ry*0.62, 0,0,Math.PI*2); g.fill();
    g.strokeStyle="rgba(255,255,255,.18)"; g.lineWidth=2;
    g.beginPath(); g.ellipse(x,y-3, rx*0.55, ry*0.35, 0,0,Math.PI*2); g.stroke();
  }
  ring(bw*0.72, bh*0.44, bw*0.20, bh*0.048, hill, plat);
  ring(bw*0.28, bh*0.84, bw*0.24, bh*0.055, hill, plat);
}

  }
  drawBattleBg(g);
  if(battle && S){
    const pos = battlePos();
    const you = S.party[battle.pi];
    const foe = battle.foe;
    const bob = Math.sin(bat.t/280)*3;
    if(foe){
      const enter = (1-bat.f.enter)*80;
      const fx = pos.f.x+bat.f.x+enter, fy = pos.f.y+bat.f.y+(isFaint(foe)?0:bob);
      if(battle.kind==="wild" && battle.rare && !isFaint(foe)){
        const pulse = 0.28 + Math.sin(bat.t/200)*0.1;
        g.save();
        g.globalAlpha = pulse * (bat.f.a==null?1:bat.f.a);
        g.strokeStyle = "#f0c14b";
        g.lineWidth = 2;
        g.beginPath();
        g.ellipse(fx, fy+8, pos.f.size*0.40, pos.f.size*0.11, 0, 0, Math.PI*2);
        g.stroke();
        g.restore();
      }
      drawSprite(g, foe.sid, pos.f.x+bat.f.x+enter, pos.f.y+bat.f.y, pos.f.size, {
        bob: isFaint(foe)?0:bob, flash:bat.f.flash, sink:bat.f.sink, alpha:bat.f.a, flip:false
      });
    }
    if(you){
      const enter = (1-bat.p.enter)*-90;
      drawSprite(g, you.sid, pos.p.x+bat.p.x+enter, pos.p.y+bat.p.y, pos.p.size, {
        bob: isFaint(you)?0:bob*1.1, flash:bat.p.flash, sink:bat.p.sink, alpha:bat.p.a, flip:true
      });
    }
    if(bat.ball){
      g.fillStyle = bat.ball.great ? "#7ec8ff" : "#f0c14b";
      g.beginPath(); g.arc(bat.ball.x, bat.ball.y, 9, 0, Math.PI*2); g.fill();
      g.fillStyle="#2a1d05"; g.fillRect(bat.ball.x-9, bat.ball.y-1.5, 18, 3);
      g.beginPath(); g.arc(bat.ball.x, bat.ball.y, 3, 0, Math.PI*2); g.fill();
    }
  }
  drawFx(g);
  if(bat.flash>0.02){
    g.fillStyle = bat.flashC || "#fff";
    g.globalAlpha = bat.flash;
    g.fillRect(-20,-20,bw+40,bh+40);
    g.globalAlpha = 1;
  }
  g.restore();
}

function battleBtns(list){
  $("bcmd").innerHTML = list.map((x,i)=>`<button data-b="${i}" ${x.dis?"disabled":""}>${x.t}</button>`).join("");
  $("bcmd").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=> list[+b.getAttribute("data-b")].fn();
  });
}

function resetBat(){
  FX.length=0;
  bat.shake=0; bat.flash=0; bat.bolt=null; bat.ball=null;
  bat.p={x:0,y:0,flash:0,sink:0,a:1,enter:0};
  bat.f={x:0,y:0,flash:0,sink:0,a:1,enter:0};
}

function pickWild(table){
  const weights = table.map(r => r[3] != null ? r[3] : 1);
  let sum = 0; weights.forEach(w => sum += w);
  let r = Math.random()*sum;
  for(let i=0;i<table.length;i++){
    r -= weights[i];
    if(r<=0) return table[i];
  }
  return table[table.length-1];
}
function startWild(){
  const table = MAPS[S.map].grass;
  if(!table || firstAlive()<0) return;
  const row = pickWild(table);
  const sid = row[0], lo = row[1], hi = row[2], weight = row[3];
  const lv = lo + Math.floor(Math.random()*(hi-lo+1));
  const foe = createMon(sid, lv);
  const rare = isRareSpawn(sid, weight);
  markSeen(sid);
  beginBattle({ kind:"wild", foe, trainerName:"", prize: 80+lv*8, rare });
}

function startTrainer(npc){
  const t = npc.trainer;
  const key = S.map+":"+npc.name;
  const team = t.team.map(([sid,lv])=>createMon(sid,lv));
  team.forEach(m=>markSeen(m.sid));
  beginBattle({ kind:"trainer", foe:team[0], team, ti:0, trainerName:t.name, prize:t.prize, gym:t.gym||false, beatKey:key });
}

async function beginBattle(b){
  busy = true;
  resetBat();
  battle = Object.assign({ pi: firstAlive(), lock:false }, b);
  showView("battle");
  fitBattle();
  paintHud();
  if(b.kind==="wild"){
    blog(b.rare ? `野生的 ${monName(b.foe)} 跳了出來！（稀有種）` : `野生的 ${monName(b.foe)} 跳了出來！`);
    if(b.rare){
      toast("稀有核獸！");
      const pos = battlePos();
      burst(pos.f.x, pos.f.y-16, ["#f0c14b","#fff59d","#ffe082","#fff"], 20, 2.4);
    }
  }else{
    blog(`${b.trainerName} 要挑戰你！`);
  }
  await tween(420, p => { bat.f.enter = p; bat.p.enter = p; });
  battleCmd();
}

function battleCmd(){
  if(!battle) return;
  battle.lock = false;
  paintHud();
  battleBtns([
    {t:"戰鬥", fn:()=> moveMenu()},
    {t:"核獸", fn:()=> switchMenu(false)},
    {t:"道具", fn:()=>{ busy=true; openBag("battle"); }},
    {t: battle.kind==="wild"?"逃跑":"不能逃", fn:()=> tryRun(), dis:battle.kind!=="wild"}
  ]);
}

function moveMenu(){
  const you = S.party[battle.pi];
  battleBtns(you.moves.map(id=>{
    const mv = MOVES[id];
    return { t: typeBadge(mv.type)+mv.name, fn:()=> playerAct({type:"move", id}) };
  }).concat([{ t:"返回", fn:battleCmd }]));
}

function switchMenu(must){
  busy = true;
  openParty(must?"battle-must":"battle", idx=>{
    if(idx===battle.pi){ toast("已經在場上"); return; }
    if(isFaint(S.party[idx])){ toast("這隻已瀕死"); return; }
    closeOverlay();
    const old = monName(S.party[battle.pi]);
    battle.pi = idx;
    bat.p.enter = 0; bat.p.sink = 0; bat.p.a = 1;
    paintHud();
    tween(280, p => { bat.p.enter = p; });
    if(must){ blog(`去吧，${monName(S.party[idx])}！`); wait(450).then(battleCmd); }
    else playerAct({type:"switch", idx, old});
  });
}

function tryRun(){
  if(battle.kind!=="wild") return;
  const you = S.party[battle.pi], foe = battle.foe;
  const chance = clamp(0.35 + (statOf(you,"spd")-statOf(foe,"spd"))/200, 0.2, 0.9);
  if(Math.random()<chance){ endBattle("逃出了戰鬥。"); }
  else { blog("逃不掉！"); afterPlayerItem(); }
}

async function playAttack(side, moveId){
  const mv = MOVES[moveId] || {type:"普", pow:40};
  const s = specOf(moveId);
  const atk = side==="p" ? bat.p : bat.f;
  const def = side==="p" ? bat.f : bat.p;
  const dir = side==="p" ? 1 : -1;
  const pos = battlePos();
  const a = side==="p" ? pos.p : pos.f;
  const b = side==="p" ? pos.f : pos.p;
  await tween(150+s*28, p => { atk.x = Math.sin(p*Math.PI)*(18+s*10)*dir; });
  spawnMoveFx(moveId, {x:a.x+atk.x, y:a.y-12}, {x:b.x, y:b.y-14});
  if(s>=2){ bat.flash = 0.55; bat.flashC = TYPE_COLOR[mv.type]||"#fff"; }
  else if(s>=1.7){ bat.flash = 0.28; bat.flashC = "#fff"; }
  await tween(240+s*90, p => {
    def.flash = p<0.5 ? 1 : 0;
    bat.shake = (1-p)*(4+s*5);
    def.x = Math.sin(p*16)*(1-p)*(6+s*3)*(side==="p"?1:-1);
    if(bat.flash>0) bat.flash *= 0.9;
  });
  atk.x = 0; def.x = 0; def.flash = 0; bat.shake = 0; bat.flash = 0;
}

async function playFaint(side){
  const a = side==="p" ? bat.p : bat.f;
  await tween(420, p => { a.sink = p*36; a.a = 1-p; });
}

async function playerAct(act){
  if(battle.lock) return;
  battle.lock = true;
  $("bcmd").innerHTML = "";
  const foeAct = aiAct();
  const you = S.party[battle.pi];
  const order = [];
  if(act.type==="switch"){
    order.push({side:"p", act});
    order.push({side:"f", act:foeAct});
  }else{
    const pp = act.type==="move" ? (MOVES[act.id].pri||0) : 0;
    const fp = foeAct.type==="move" ? (MOVES[foeAct.id].pri||0) : 0;
    const ys = statOf(you,"spd"), fs = statOf(battle.foe,"spd");
    const firstP = pp>fp || (pp===fp && ys>=fs);
    if(firstP){ order.push({side:"p",act}); order.push({side:"f",act:foeAct}); }
    else { order.push({side:"f",act:foeAct}); order.push({side:"p",act}); }
  }
  for(const step of order){
    if(!battle) return;
    if(step.side==="p" && isFaint(S.party[battle.pi])) continue;
    if(step.side==="f" && isFaint(battle.foe)) continue;
    await doAct(step.side, step.act);
    if(await checkFaints()) return;
  }
  if(battle) battleCmd();
}

async function afterPlayerItem(){
  battle.lock = true; $("bcmd").innerHTML = "";
  await doAct("f", aiAct());
  if(await checkFaints()) return;
  if(battle) battleCmd();
}

function aiAct(){
  const foe = battle.foe;
  const you = S.party[battle.pi];
  let best = foe.moves[0], score = -1;
  foe.moves.forEach(id=>{
    const mv = MOVES[id];
    const s = (mv.pow||0) * typeMul(mv.type, SPECIES[you.sid].types);
    if(s>score){ score=s; best=id; }
  });
  if(Math.random()<0.25) best = pick(foe.moves);
  return {type:"move", id:best};
}

async function doAct(side, act){
  if(act.type==="switch"){
    blog(`${act.old}，回來！去吧，${monName(S.party[battle.pi])}！`);
    paintHud();
    await tween(280, p => { bat.p.enter = p; });
    return;
  }
  const atk = side==="p" ? S.party[battle.pi] : battle.foe;
  const def = side==="p" ? battle.foe : S.party[battle.pi];
  const mv = MOVES[act.id];
  blog(`${monName(atk)} 使出 ${mv.name}！`);
  await wait(180);
  if(Math.random()*100 > mv.acc){
    blog("沒有打中！");
    const miss = side==="p" ? bat.f : bat.p;
    await tween(200, p => { miss.x = Math.sin(p*Math.PI)*18*(side==="p"?1:-1); });
    miss.x = 0;
    await wait(200);
    return;
  }
  await playAttack(side, act.id);
  const stab = SPECIES[atk.sid].types.includes(mv.type) ? 1.5 : 1;
  const eff = typeMul(mv.type, SPECIES[def.sid].types);
  const base = ((2*atk.lv/5+2)*mv.pow*statOf(atk,"atk")/statOf(def,"def"))/50 + 2;
  const dmg = Math.max(1, Math.floor(base*stab*eff*(0.85+Math.random()*0.15)));
  def.hp = Math.max(0, def.hp-dmg);
  paintHud();
  let extra = `造成 ${dmg} 傷害。`;
  if(eff>1.5) extra += " 效果絕佳！";
  else if(eff<1 && eff>0) extra += " 似乎不太有效…";
  blog(extra);
  await wait(380);
}

async function checkFaints(){
  if(!battle) return true;
  const you = S.party[battle.pi];
  if(isFaint(battle.foe)){
    blog(`${monName(battle.foe)} 倒下了！`);
    await playFaint("f");
    if(battle.kind==="trainer"){
      battle.ti++;
      if(battle.ti < battle.team.length){
        battle.foe = battle.team[battle.ti];
        bat.f = {x:0,y:0,flash:0,sink:0,a:1,enter:0};
        blog(`${battle.trainerName} 派出了 ${monName(battle.foe)}！`);
        paintHud();
        await tween(320, p => { bat.f.enter = p; });
        return false;
      }
    }
    await gainExp(battle.foe);
    await winBattle();
    return true;
  }
  if(isFaint(you)){
    blog(`${monName(you)} 倒下了！`);
    await playFaint("p");
    if(living(S.party).length){ switchMenu(true); return true; }
    await loseBattle();
    return true;
  }
  return false;
}

async function gainExp(foe){
  const you = S.party[battle.pi];
  if(isFaint(you)) return;
  const got = Math.floor(SPECIES[foe.sid].exp * foe.lv / 6);
  blog(`${monName(you)} 獲得 ${got} 經驗！`);
  let remain = got;
  while(remain>0 && you.lv<50){
    const need = expToNext(you.lv) - you.exp;
    const add = Math.min(remain, need);
    const from = you.exp;
    you.exp += add;
    remain -= add;
    const next = expToNext(you.lv);
    await tween(300, p => {
      const el = $("pExp");
      if(!el) return;
      el.style.transition = "none";
      el.style.width = ((from + add*p)/next*100)+"%";
    });
    setExpBar(you);
    if(you.exp>=expToNext(you.lv) && you.lv<50){
      you.exp = 0;
      const old = maxHp(you);
      you.lv++;
      you.hp += maxHp(you)-old;
      SPECIES[you.sid].learn.filter(x=>x[0]===you.lv).forEach(x=>{
        const id=x[1]; if(you.moves.includes(id)) return;
        if(you.moves.length<4) you.moves.push(id);
        else you.moves = you.moves.slice(1).concat([id]);
      });
      blog(`${monName(you)} 升到 Lv.${you.lv}！`);
      const el = $("pExp");
      if(el){ el.style.transition="none"; el.style.width="100%"; }
      await wait(140);
      if(el) el.style.width="0%";
      paintHud();
      await wait(380);
    }
  }
  if(you.lv>=50){ you.exp = 0; setExpBar(you); }
  const sp = SPECIES[you.sid];
  if(sp.evo && you.lv>=sp.evo[1]){
    const to = sp.evo[0];
    blog(`${sp.name} 的核能湧現……`);
    burst(battlePos().p.x, battlePos().p.y-20, ["#fff","#f0c14b","#ff8a4c"], 28, 3);
    await wait(500);
    you.sid = to;
    you.hp = Math.min(maxHp(you), you.hp + 8);
    markCaught(to); markSeen(to);
    blog(`進化成 ${SPECIES[to].name}！`);
    paintHud(); await wait(650);
  }
}

async function resolveCatch(ballKey){
  battle.lock = true; $("bcmd").innerHTML = "";
  const foe = battle.foe;
  const mul = ballKey==="great"?1.8:1;
  const max = maxHp(foe);
  const a = ((3*max - 2*foe.hp) * SPECIES[foe.sid].rate * mul) / (3*max);
  const chance = clamp(a/255, 0.05, 0.95);
  blog(`投出了${ITEMS[ballKey].name}！`);
  const pos = battlePos();
  bat.ball = { x:pos.p.x, y:pos.p.y-20, great: ballKey==="great" };
  await tween(380, p => {
    bat.ball.x = pos.p.x + (pos.f.x-pos.p.x)*p;
    bat.ball.y = pos.p.y-20 + (pos.f.y-pos.p.y-20)*p - Math.sin(p*Math.PI)*50;
  });
  if(Math.random()<chance){
    await tween(240, p => { bat.f.a = 1-p; bat.f.sink = p*10; });
    for(let i=0;i<3;i++){
      await tween(140, p => { bat.ball.x = pos.f.x + Math.sin(p*Math.PI*2)*8; });
    }
    const got = cloneMon(foe);
    got.hp = Math.max(1, got.hp);
    const where = addMon(got);
    blog(`捕捉成功！${monName(got)} ${where==="box"?"已送入核倉。":"加入隊伍！"}`);
    await wait(700);
    endBattle("");
  }else{
    burst(pos.f.x, pos.f.y-16, ["#fff","#f0c14b"], 12, 2.5);
    bat.ball = null;
    blog("可惜，它掙脫了！");
    await wait(400);
    await afterPlayerItem();
  }
}

async function winBattle(){
  S.money += battle.prize;
  if(battle.kind==="trainer"){
    S.flags.beaten[battle.beatKey] = 1;
    if(battle.gym){
      const flag = battle.gym === true ? "gym1" : battle.gym;
      S.flags[flag] = true;
      S.bag.great = (S.bag.great||0)+3;
      const badge = {gym1:"燼炎徽章", gym2:"潮浪徽章", gym3:"鋼脊徽章", gym4:"霜霧徽章"}[flag]||"徽章";
      blog("擊敗"+battle.trainerName+"！獲得"+badge+"與 3 顆高級核。");
      await wait(850);
    }
  }
  persist();
  endBattle(battle.kind==="wild" ? "戰鬥結束。" : `${battle.trainerName} 被你打敗了！◎${battle.prize}`);
}

async function loseBattle(){
  const lose = Math.floor(S.money*0.15);
  S.money = Math.max(0, S.money-lose);
  healAll();
  S.map="town"; S.x=3; S.y=2;
  persist();
  endBattle("隊伍全滅……醒來時已在暉光鎮治療臺。");
}

function endBattle(msg){
  if(msg) blog(msg);
  battle = null; busy=false;
  resetBat();
  resetWalk();
  showView("world"); fitCanvas(); drawWorld();
  persist();
}

/* —— Input —— */
function paintPad(dx,dy){
  [["dU",0,-1],["dD",0,1],["dL",-1,0],["dR",1,0]].forEach(([id,x,y])=>{
    $(id).classList.toggle("on", dx===x && dy===y);
  });
}
function holdDir(dx,dy){
  moveHold={dx,dy};
  paintPad(dx,dy);
  tryMove(dx,dy);
}
function releaseDir(dx,dy){
  if(moveHold && moveHold.dx===dx && moveHold.dy===dy){
    moveHold=null;
    paintPad(9,9);
  }
}
function padDirFromEvent(ev, el){
  const r = el.getBoundingClientRect();
  const x = (ev.clientX - r.left)/r.width - 0.5;
  const y = (ev.clientY - r.top)/r.height - 0.5;
  if(Math.abs(x)<0.10 && Math.abs(y)<0.10) return moveHold ? [moveHold.dx, moveHold.dy] : null;
  return Math.abs(x)>Math.abs(y) ? (x<0?[-1,0]:[1,0]) : (y<0?[0,-1]:[0,1]);
}
(function bindPad(){
  const pad = $("dpad");
  let pid = null;
  const apply = ev=>{
    const d = padDirFromEvent(ev, pad);
    if(!d) return;
    if(!moveHold || moveHold.dx!==d[0] || moveHold.dy!==d[1]) holdDir(d[0], d[1]);
  };
  pad.addEventListener("pointerdown", ev=>{
    ev.preventDefault();
    pid = ev.pointerId;
    try{ pad.setPointerCapture(ev.pointerId); }catch(e){}
    apply(ev);
  });
  pad.addEventListener("pointermove", ev=>{
    if(pid==null || ev.pointerId!==pid) return;
    ev.preventDefault();
    apply(ev);
  });
  const stop = ev=>{
    if(pid==null || (ev && ev.pointerId!==pid)) return;
    pid = null;
    moveHold = null;
    paintPad(9,9);
  };
  pad.addEventListener("pointerup", stop);
  pad.addEventListener("pointercancel", stop);
})();
$("btnA").onclick = interact;
$("btnM").onclick = ()=> openMenu(false);

window.addEventListener("keydown", e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if(e.key==="Escape"){
    if(overlay.classList.contains("on")){
      if(views.battle.classList.contains("on")){
        if(sheet.querySelector("#pBack") || sheet.querySelector("#bagBack")){
          closeOverlay(); busy=false; if(battle && !battle.lock) battleCmd();
        }
      }else closeToWorld();
    }else openMenu(false);
    return;
  }
  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W") holdDir(0,-1);
  if(e.key==="ArrowDown"||e.key==="s"||e.key==="S") holdDir(0,1);
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") holdDir(-1,0);
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") holdDir(1,0);
  if(e.key==="Enter"||e.key==="z"||e.key==="Z"||e.key===" ") interact();
});
window.addEventListener("keyup", e=>{
  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W") releaseDir(0,-1);
  if(e.key==="ArrowDown"||e.key==="s"||e.key==="S") releaseDir(0,1);
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") releaseDir(-1,0);
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") releaseDir(1,0);
});

["gesturestart","gesturechange","gestureend"].forEach(t=>{
  document.addEventListener(t, e=>e.preventDefault(), {passive:false});
});
overlay.addEventListener("click", e=>{
  if(e.target!==overlay) return;
  if(views.battle.classList.contains("on")){
    if(!sheet.querySelector("#pBack") && !sheet.querySelector("#bagBack")) return;
    closeOverlay(); busy=false; if(battle && !battle.lock) battleCmd();
    return;
  }
  closeToWorld();
});

window.addEventListener("resize", ()=>{
  fitAppFrame();
  if(views.world.classList.contains("on")){ fitCanvas(); drawWorld(); }
  if(views.battle.classList.contains("on")) fitBattle();
});
if(window.visualViewport){
  visualViewport.addEventListener("resize", ()=>{
    if(views.world.classList.contains("on")){ fitCanvas(); drawWorld(); }
    if(views.battle.classList.contains("on")) fitBattle();
  });
}

let lastTs = performance.now();
function loop(now){
  const dt = Math.min(40, now-lastTs);
  lastTs = now;
  bat.t += dt;
  updateFx(dt);
  if(views.world.classList.contains("on") && S){
    updateWalk(dt);
    if(!cw) fitCanvas();
    drawWorld();
  }
  if(views.battle.classList.contains("on")){
    if(!bw) fitBattle();
    renderBattle();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function renderStarters(){
  $("starterCards").innerHTML = STARTERS.map(st=>{
    const sp = SPECIES[st.sid];
    return `<button class="scard" data-sid="${st.sid}">
      ${port(st.sid,true)}
      <div><b>${sp.name}</b> ${sp.types.map(typeBadge).join("")}<small>${st.blurb}</small></div>
    </button>`;
  }).join("");
  $("starterBack").onclick = ()=>{ showView("title"); refreshTitleBtns(); };
  $("starterCards").querySelectorAll(".scard").forEach(b=>{
    b.onclick = ()=> pickStarter(b.getAttribute("data-sid"));
  });
}
function beginWithStarter(sid){
  backupCurrentSave();
  S = defaultState();
  const mon = createMon(sid, 5);
  addMon(mon);
  persist();
  refreshTitleBtns();
  enterWorld();
  openDialog("核導教授", [
    `就決定是 ${monName(mon)} 了。`,
    "在草叢遇敵、用靈核捕捉，隊伍最多 6 隻。",
    "南邊有見習訓練家與燼炎館。去成為核導者吧。"
  ]);
}
function pickStarter(sid){
  const sp = SPECIES[sid];
  if(!sp) return;
  if(!loadSave()){ beginWithStarter(sid); return; }
  openSheet(`<h2>用${sp.name}開新遊戲？</h2>
    <div class="sheet-body"><p style="line-height:1.75">現在這份存檔會被換掉，舊進度會另存，之後可在標題恢復。</p></div>
    <div class="sheet-actions">
      <button type="button" id="ngNo">取消</button>
      <button type="button" class="gold" id="ngYes">開始</button>
    </div>`);
  $("ngNo").onclick = ()=> closeOverlay();
  $("ngYes").onclick = ()=> beginWithStarter(sid);
}

function paintTitleArt(){
  const c = $("titleArt");
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.clearRect(0,0,120,120);
  drawSprite(g, "flarefox", 60, 88, 112, {});
}

function startNewGame(){
  closeOverlay();
  showView("starter");
  renderStarters();
}
function continueGame(){
  const data = loadSave();
  if(!data || !data.party || !data.party.length){ toast("還沒有存檔，請先開新旅程"); return; }
  S = data;
  enterWorld();
}
function restoreBakGame(){
  const bak = loadBak();
  if(!bak){ toast("沒有上一份存檔"); return; }
  openSheet(`<h2>恢復上一份存檔？</h2>
    <div class="sheet-body"><p style="line-height:1.75">會用開新遊戲前自動留下的那份進度，覆蓋現在這份。</p></div>
    <div class="sheet-actions">
      <button type="button" id="rsNo">取消</button>
      <button type="button" class="gold" id="rsYes">恢復並繼續</button>
    </div>`);
  $("rsNo").onclick = ()=> closeOverlay();
  $("rsYes").onclick = ()=>{
    try{ localStorage.setItem(SAVE_KEY, localStorage.getItem(SAVE_BAK)); }catch(e){}
    const data = loadSave();
    refreshTitleBtns();
    if(!data || !data.party || !data.party.length){ closeOverlay(); toast("恢復失敗"); return; }
    S = data;
    enterWorld();
    toast("已恢復上一份存檔");
  };
}
window.startNewGame = startNewGame;
window.continueGame = continueGame;
window.restoreBakGame = restoreBakGame;
window.openHelp = openHelp;
$("spdBtn").textContent = spdLabel();
$("spdBtn").onclick = ev=>{ ev.preventDefault(); cycleSpeed(); };
refreshTitleBtns();
try{ paintTitleArt(); }catch(e){}
showView("title");
})();
</script>
</body>
</html>
